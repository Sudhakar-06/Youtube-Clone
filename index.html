<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylsheet" href="css/styles.css">
  <title>Youtube Clone</title>
</head>
<body>
  <header>
    <div class="header-left">
      <button>
        <img src="assets/menu.svg" alt="menu-icon">
      </button>
      <a href="#">
        <img src="assets/youtube-logo.svg" alt="youtube-logo">
      </a>
    </div>
    <div class="header-middle">
      <form>
        <input type="search" placeholder="Search">
        <button>
          <img src="assets/search.svg" alt="search-icon">
        </button>
      </form>
    </div>
    <div class="header-right">
      <button>
        <img src="assets/create.svg" alt="create-icon">
      </button>
      <button>
        <img src="assets/notifications.svg" alt="notifications-icon">
      </button>
      <button>
        <img src="assets/mic.svg" alt="mic-icon">
      </button>
      <img src="assets/my-channel.jpeg" alt="profile-picture">
    </div>
  </header>
</body>
</html>
