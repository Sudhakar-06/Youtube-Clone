<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"> 
  <title>Youtube Clone</title>
</head>
<body>
   <header>
      <a href="#">
         <img class="logo" src="assets/youtube-logo.svg" alt="youtube-logo">
      </a>
      <div class="header-actions">
         <button class="bell-button">
            <img class="header-icons" src="assets/icons/notifications.svg" alt="notifications-icon">
            <span>9+</span>
         </button>
         <button class="search-button">
            <img class="header-icons" src="assets/icons/search.svg" alt="search-icon">
         </button>
      </div>
   </header>

   <div class="chips">
      <button class="chip">
         <img src="assets/icons/explore.svg" alt="explore-chip">
      </button>
      <button class="chip active">All</button>
      <button class="chip">New to you</button>
      <button class="chip">Hyped</button>
      <button class="chip">Music</button>
      <button class="chip">Gaming</button>
      <button class="chip">Live</button>
      <button class="chip">News</button>
      <button class="chip">Cricket</button>
   </div>

   <main>
      <article class="video-card">
         <div class="thumbnail-wrapper">
            <img class="thumbnail" src="assets/thumbnails/thumbnail-1.webp">
            <span class="duration">8:30</span>
         </div>
         <div class="video-info">
            <img class="avatar" src="assets/channels/channel-1.jpeg">
            <div class="video-details">
               <h3 class="title">Talking Tech and AI with Google CEO Sundar Pichai</h3>
               <p class="stats">
                  Markiplier &#183; 1.2M views &#183; 3 days ago
               </p>
            </div>
            <button class="more_vert">
               <img src="assets/icons/more_vert.svg">
            </button>
         </div>
      </article>
   </main>
   
</body>
</html>
