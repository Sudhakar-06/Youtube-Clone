<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"> 
  <title>Youtube Clone</title>
</head>
<body>
   <header>
      <a href="#">
         <img class="logo" src="assets/youtube-logo.svg" alt="youtube-logo">
      </a>
      <div class="header-actions">
         <button class="bell-button">
            <img class="header-icons" src="assets/icons/notifications.svg" alt="notifications-icon">
            <span>9+</span>
         </button>
         <button class="search-button">
            <img class="header-icons" src="assets/icons/search.svg" alt="search-icon">
         </button>
      </div>
   </header>
</body>
</html>
